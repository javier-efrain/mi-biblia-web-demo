name: Actualización automática de la demostración técnica

on:
  workflow_dispatch:
  push:
    branches: [publicacion-demo]
    paths: ['.github/**', 'revision/**']
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  preparar:
    if: >-
      github.repository == 'javier-efrain/mi-biblia-web-demo' &&
      github.ref == 'refs/heads/publicacion-demo' &&
      (github.event_name == 'workflow_dispatch' || vars.PUBLICACION_DEMO_HABILITADA == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.paquete.outputs.revision }}
      huella: ${{ steps.revision.outputs.huella }}
      nueva: ${{ steps.publicada.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar los 27 archivos sintéticos del commit fuente
        id: paquete
        run: python .github/scripts/paquete.py --actualizar --salida _site --informe candidato.json
      - name: Validar autorización y calcular huella conjunta
        id: revision
        run: python .github/scripts/revision.py --sitio _site --informe candidato.json
      - name: Detectar si esta misma versión ya se publicó
        id: publicada
        uses: actions/cache/restore@v4
        with:
          path: .estado-publicacion
          key: demo-publicada-v3-${{ steps.revision.outputs.huella }}
          lookup-only: true

      - name: Comprobar validadores
        if: steps.publicada.outputs.cache-hit != 'true'
        env:
          PAQUETE_A_PROBAR: _site
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Instalar herramientas de prueba
        if: steps.publicada.outputs.cache-hit != 'true'
        run: |
          python -m pip install -r .github/requirements-pruebas.txt
          python -m playwright install --with-deps chromium
      - name: Probar el paquete bajo la subruta de Pages
        if: steps.publicada.outputs.cache-hit != 'true'
        run: python .github/scripts/probar_paquete.py --paquete _site --informe pruebas.json
      - name: Incorporar la revisión autorizada sin alterar los 27 archivos sintéticos
        if: steps.publicada.outputs.cache-hit != 'true'
        run: python .github/scripts/revision.py --sitio _site --informe candidato.json --incorporar
      - name: Probar la revisión en escritorio y móvil bajo la subruta de Pages
        if: steps.publicada.outputs.cache-hit != 'true'
        run: python .github/scripts/probar_revision.py --sitio _site --informe pruebas-revision.json
      - name: Registrar el commit validado
        if: steps.publicada.outputs.cache-hit != 'true'
        env:
          REVISION: ${{ steps.paquete.outputs.revision }}
          HUELLA: ${{ steps.revision.outputs.huella }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Demostración sintética y revisión editorial\n\n')
              f.write('Fuente: `desarrollo-motor-visual`\n\n')
              f.write('Commit fuente: `' + os.environ['REVISION'] + '`\n\n')
              f.write('Huella del paquete combinado: `' + os.environ['HUELLA'] + '`\n\n')
              f.write('Revisión autorizada y paquete sintético validado por separado antes de componer el sitio.\n')
          PY
      - name: Guardar evidencia de las pruebas
        if: steps.publicada.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: revision-candidata
          path: |
            candidato.json
            pruebas.json
            pruebas-revision.json
          retention-days: 7
      - name: Empaquetar únicamente _site
        if: steps.publicada.outputs.cache-hit != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  publicar:
    needs: preparar
    if: vars.PUBLICACION_DEMO_HABILITADA == 'true' && needs.preparar.outputs.nueva == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Usar Pages ya habilitado por el propietario, sin activarlo automáticamente
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Publicar solo después de superar las pruebas
        id: despliegue
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: revision-candidata
          path: _verificacion
      - name: Verificar todos los archivos del paquete combinado servidos por Pages
        env:
          URL_PAGES: ${{ steps.despliegue.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, json, os, time
          from urllib.request import urlopen
          from pathlib import Path
          informe = json.loads(Path('_verificacion/candidato.json').read_text())
          base = os.environ['URL_PAGES'].rstrip('/') + '/'
          pendientes = dict(informe['sha256'])
          for intento in range(12):
              for ruta, esperado in list(pendientes.items()):
                  try:
                      with urlopen(base + ruta + '?revision=' + informe['revisionFuente'], timeout=20) as respuesta:
                          recibido = hashlib.sha256(respuesta.read()).hexdigest()
                      if recibido == esperado:
                          del pendientes[ruta]
                  except OSError:
                      pass
              if not pendientes:
                  break
              time.sleep(10)
          if pendientes:
              raise SystemExit('La web servida no coincide con el paquete probado: ' + ', '.join(pendientes))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Verificación pública: todos los archivos servidos coinciden con el inventario del despliegue; commit fuente sintético `' + informe['revisionFuente'] + '`.\n')
          PY
      - name: Comprobar el lector desde la URL pública en escritorio y móvil
        env:
          URL_PAGES: ${{ steps.despliegue.outputs.page_url }}
        run: |
          python -m pip install -r .github/requirements-pruebas.txt
          python -m playwright install --with-deps chromium
          python .github/scripts/probar_revision.py --sitio . --url "$URL_PAGES" --informe pruebas-publicas.json
      - name: Recordar la versión publicada
        env:
          HUELLA: ${{ needs.preparar.outputs.huella }}
        run: |
          mkdir -p .estado-publicacion
          printf '%s\n' "$HUELLA" > .estado-publicacion/huella
      - uses: actions/cache/save@v4
        with:
          path: .estado-publicacion
          key: demo-publicada-v3-${{ needs.preparar.outputs.huella }}
